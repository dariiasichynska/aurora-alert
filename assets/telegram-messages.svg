system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#6ab3f3'>google.com/travel/flights?q=…LLA…</text><text x='36' y='315' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#f0efec'>━━━━━━━━━━━━━━</text><text x='36' y='334' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#f0efec'>🇫🇮 SAARISELKÄ — 20% (5%)</text><text x='36' y='353' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#f0efec'>✈️ IVL</text><text x='36' y='372' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#6ab3f3'>google.com/travel/flights?q=…IVL…</text><text x='36' y='391' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#f0efec'>━━━━━━━━━━━━━━</text><text x='36' y='410' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#f0efec'>🇫🇮 LEVI — 72% (66%)  ·  🇫🇮 ROVANIEMI — 41% (30%)</text><text x='36' y='429' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#f0efec'></text><text x='36' y='448' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#f0efec'>🌞💨 Solar wind: 612 km/s</text><text x='36' y='467' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#f0efec'>⚡ Looks like a coronal hole — expect a repeat around 06.12</text><text x='474' y='494' text-anchor='end' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#8b9bab'>21:00 ✓✓</text><text x='510' y='40' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='#f0efec'>② Go-outside alarm — real time</text><rect x='510' y='56' width='470' height='431' rx='14' fill='#182533'/><text x='526' y='82' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' fill='#6ab3f3'>Aurora Alert bot</text><text x='526' y='106' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#f0efec'>🚨🌌 AURORA ALERT — GO OUTSIDE!</text><text x='526' y='125' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#f0efec'></text><text x='526' y='144' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#f0efec'>⏱ It should start within 30–60 minutes.</text><text x='526' y='163' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#f0efec'>Dress warmly, this takes more than five minutes.</text><text x='526' y='182' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#f0efec'></text><text x='526' y='201' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#f0efec'>🧭 Look NORTH</text><text x='526' y='220' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#f0efec'>Away from street lights. At first you will only see</text><text x='526' y='239' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#f0efec'>a grey band above the horizon — that is it.</text><text x='526' y='258' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#f0efec'>━━━━━━━━━━━━━━</text><text x='526' y='277' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#f0efec'>🚪 Door to the atmosphere: WIDE OPEN</text><text x='526' y='296' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#f0efec'>(−12.4 nT — the more negative, the better)</text><text x='526' y='315' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#f0efec'></text><text x='526' y='334' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#f0efec'>💨 Solar wind: very fast</text><text x='526' y='353' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#f0efec'>(640 km/s)</text><text x='526' y='372' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#f0efec'></text><text x='526' y='391' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#f0efec'>🔋 Power reserve: large — check again</text><text x='526' y='410' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#f0efec'>in half an hour  (17.8 nT)</text><text x='526' y='429' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#f0efec'>━━━━━━━━━━━━━━</text><text x='526' y='448' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#f0efec'>📷 5–10 s, ISO 1600, focus at ∞, tripod</text><text x='964' y='475' text-anchor='end' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#8b9bab'>21:00 ✓✓</text><text x='20' y='534' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#8b9bab'>Message layouts are the real Make templates; the numbers shown are illustrative sample values.</text></svg>